  description: 過去のアウトプット（書籍・X投稿まとめ・ブログ・メルマガ等）から抽出されたテキストを読み込み、著者プロファイル5項目（専門領域・思想・文体・実績・発信スタンス）を自動生成するワークフロー。テキスト抽出はポータル側で実施する想定。STEP1〜14の各プロンプトに注入する基礎データを生成する。書籍ごとのターゲット読者像はSTEP1で決めるため著者プロファイルには含めない。
