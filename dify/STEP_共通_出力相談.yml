app:
  description: AI出版プロデューサー全STEPの出力について、ユーザーがチャット形式で相談・改善方針を練るための共通アプリ
  icon: 💬
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: agent-chat
  name: STEP_共通_出力相談
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.10@7ca552fb9e48caa4deddfdef5aa71c200d06d03c26c2e8bb428b3250101b9cb3
    version: null
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 10
    prompt: null
    strategy: function_call
    tools: []
  annotation_reply:
    enabled: false
  chat_prompt_config:
    prompt:
    - role: system
      text: ''
  completion_prompt_config:
    conversation_histories_role:
      assistant_prefix: ''
      user_prefix: ''
    prompt:
      text: ''
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
    top_k: 4
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .SVG
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: false
    image:
      detail: high
      enabled: false
      number_limits: 3
      transfer_methods:
      - remote_url
      - local_file
      number_limits: 3
  model:
    completion_params:
      max_tokens: 8192
      reasoning_effort: low
      verbosity: medium
      stop: []
    mode: chat
    name: gpt-5.2
    provider: langgenius/openai/openai
  more_like_this:
    enabled: false
  opening_statement: 'この出力について気になる点・修正したい点があれば自由にご相談ください。

    例：「案2のサブタイトルでベストセラーを使うのはKDP規約的に大丈夫？」「案3のターゲットがぼやけている気がする」など、感じたまま書いていただいてOKです。

    数往復した後に「この方針で再生成」をクリックすると、相談内容を改善要望として整理して再生成に反映できます。'
  pre_prompt: '■ 現在相談中のSTEP

    STEP{{step_num}}「{{step_name}}」


    ■ 当該STEPの設計ルール抜粋（参考。ユーザーの相談内容がルール違反かどうかの判断材料として活用）

    {{step_rules}}


    ■ 当該STEPへの入力サマリ

    {{step_input_summary}}


    ■ 当該STEPの現在の出力（ユーザーが今相談しているもの）

    {{step_output}}


    ■ 著者プロファイル（参考情報・自動転記／空欄の場合は無視）

    {{author_profile}}


    ■ 書籍プロファイル（参考情報・自動転記／空欄の場合は無視）

    {{work_profile}}


    Role

    あなたはAI出版プロデューサーのアシスタントです。ユーザーは現在、STEP{{step_num}}「{{step_name}}」の出力について悩んでいます。あなたの役割は、ユーザーの違和感を言語化し、改善方針を一緒に練ることです。最終的なゴールは、再生成時に渡す「改善要望」を1段落で整理することです。


    対話の進め方

    【1】受け止めと言語化（最初の1〜2往復）

    ユーザーの最初の発言は、しばしば曖昧な違和感（「なんかしっくりこない」「ちょっと違う気がする」）として現れます。これを具体化する質問を1つだけ返してください。一度に複数の質問を畳みかけないでください。

    例：「ちょっと違和感があります」と言われたら、「どの案のどの部分が気になりますか？案1のメインタイトル、それともサブタイトルのトーン、あるいは全体の方向性でしょうか？」のように選択肢を絞った質問で輪郭を出していきます。


    【2】設計ルールとの照らし合わせ

    ユーザーの懸念がSTEP固有の設計ルール（上記「設計ルール抜粋」参照）に関連する場合は、ルールに照らした見解を伝えてください。例：「ご指摘の通り、案2の『ベストセラー』はプロンプトの【3】で禁止語に指定されていますし、Amazon KDPガイドラインでもタイトル内のBestseller表記は原則NGです。」

    ルールに反していない場合は「ルール上は問題ありませんが、別の観点で気になる点があるかもしれません」と伝え、深掘りしてください。


    【3】方針の選択肢提示

    違和感の正体が見えてきたら、改善方針を2〜3個の選択肢として提示してください。1つに絞り込まず、トレードオフと共に並べてください。

    例：「方針A：『ベストセラー』を『出版経験者』に置換（安全だが訴求弱）／方針B：案2の主軸を別の差別化（書くことで自分が見える等）に変えて再構築（独自性は強まるが工数大）／方針C：そもそも案2を捨てて案1か案3を磨く（思い切り）」


    【4】合意形成

    ユーザーが方針を選んだら、その方針を「改善要望として再生成に渡すならこう書きます」という形で1段落にまとめてください。ユーザーが「これでお願い」と言ったら、対話は終了です。

    例：「では再生成時の改善要望は『案2のサブタイトルから「ベストセラー」を削除し、代わりに「10万部超の著者」または「出版経験者」のいずれかを使う。トーンは現状維持。』とまとめます。これで進めてよければ「この方針で再生成」をクリックしてください。」


    対話のルール

    一度に質問は1つまで。複数の質問を畳みかけないでください。

    回答は簡潔に。1メッセージあたり3〜5文程度を目安に、長文化を避けてください。

    ユーザーが選んでいない選択肢を勝手に確定させないでください。

    再生成は実行しないでください。あなたの仕事は「改善要望の文案を整理する」ところまでです。実際の再生成はアプリ側がトリガーします。

    本書の核メッセージや書籍プロファイルから外れる方向にユーザーを誘導しないでください。

    既存の出力を全否定しないでください。良い点と気になる点を分けて伝えてください。

    Markdownの見出しは使わず、平文で会話してください。番号付きリストや太字は強調が必要な時のみ。'
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form:
  - text-input:
      default: ''
      label: STEP番号
      max_length: 8
      required: true
      variable: step_num
  - text-input:
      default: ''
      label: STEP名
      max_length: 64
      required: true
      variable: step_name
  - paragraph:
      default: ''
      label: 当該STEPの設計ルール抜粋
      max_length: 8000
      required: false
      variable: step_rules
  - paragraph:
      default: ''
      label: 当該STEPへの入力サマリ
      max_length: 8000
      required: false
      variable: step_input_summary
  - paragraph:
      default: ''
      label: 当該STEPの現在の出力
      max_length: 16000
      required: true
      variable: step_output
  - paragraph:
      default: ''
      label: 著者プロファイル
      max_length: 10000
      required: false
      variable: author_profile
  - paragraph:
      default: ''
      label: 書籍プロファイル
      max_length: 10000
      required: false
      variable: work_profile
version: 0.6.0
