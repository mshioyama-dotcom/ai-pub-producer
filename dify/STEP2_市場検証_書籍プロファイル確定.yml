            ## 書籍プロファイル確定版

            **整合性診断の結果に関わらず、確定版は必ず出力する**。整合性診断で ✗ 致命的が出た場合でも、STEP1 草案を尊重して下記フォーマット全項目を埋めて出力すること。確定版を空にしたり「STEP1修正提案を反映してから再実行してください」のような指示文だけにするのは禁止。

            整合性診断の結果に応じて refine の度合いを変える：

            - **整合性診断が合格（✗ 0個、△ 1個以下）の場合**：
              全項目を市場知見で積極的に refine する。表現を磨き、空白地帯を活用し、コア・ベネフィットを具体化する。確定版冒頭の警告コメントは付けない。

            - **整合性診断で △ または ✗ が出た場合**：
              確定版冒頭に以下の警告コメントを必ず付ける：
              `※ 整合性診断で不整合が検出されました（市場と本書ジャンルのズレ等）。STEP1修正提案を反映してから再実行することを強く推奨します。下記は STEP1 草案を尊重した暫定確定版です。`
              そのうえで全項目を埋める：
              - 仮テーマ・想定読者・コア・ベネフィット・著者の角度・ポジショニング・読了後の状態・動機・出版目標 は STEP1 草案の内容をほぼそのまま転記（軽微な整形のみ）
              - 検索キーワード3軸は **STEP1修正提案で提示した新キーワード** をそのまま採用（市場で日本書籍が並ぶ語に）
              - 検索者の意図（仮説）は新キーワードに合わせて再生成
              - **草案のジャンルを変更してはいけない**（市場の引力で副業前段に倒すなどは禁止）

            ■ 仮テーマ
            ↓ refine 後の仮テーマを1〜2文で

            ■ 想定読者
            ↓ refine 後の想定読者像を3〜5行で

            ■ コア・ベネフィット
            ↓ STEP1草案の「コア・ベネフィット」を市場検証結果（上位本の訴求語・空白地帯）を踏まえて refine。読者目線の1文。

            ■ 動機（原文を保持）
            {{#1771119975121.motivation#}}

            ■ 出版目標
            ↓ STEP1草案の「出版目標」をそのまま転記し、市場検証で判明した内容を踏まえて選ばれたゴール（ロングセラー／リードマグネット／権威付け 等）に対する市場的な実現可能性を1〜2行で追記。

            ■ 著者の角度
            ↓ refine 後の著者の角度を3〜5行で

            ■ ポジショニング
            ↓ refine 後のポジショニングを3〜5行で（市場の空白地帯と本の目的を反映）

            ■ 読了後の状態
            ↓ refine 後の読了後の状態を3〜5行で

            ■ 検索キーワード3軸（再選定可・全軸とも厳格に2語のみ・3語以上禁止）
            **絶対ルール**: 3軸すべて半角スペース区切りで「ちょうど2語」。3語以上は Amazon Kindle 検索結果が極端に少なくなり市場検証が機能しなくなる。年代を入れたい場合は他の語と入れ替える。
            - 主題軸: （2語）
            - 読者軸: （2語）
            - 差分軸: （2語）

            ■ 検索者の意図（仮説）
            ↓ 主題軸キーワードで検索する人が何に困っていて何を知りたいかを1〜2文で。形式「〜したいが、〜なので、〜を知りたい」。

            ## 検証で参照した上位本（参考）

            （上位本データの **タイトル一覧** をシンプルに転記。各軸の上位5件程度。Keepa の数値は使わない。）

            ━━━━━━━━━━━
            【ルール（厳守）】
