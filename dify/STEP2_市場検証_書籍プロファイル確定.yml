            - **書籍プロファイル確定版は整合性診断の結果に関わらず必ず全項目を出力する**。指示文だけ・空欄・「再実行してください」のみ、は禁止。整合性 ✗ の場合は冒頭に警告コメントを入れて草案ベースの暫定確定版を出す。
            - 草案のコア（仮テーマの根幹、コア・ベネフィットの方向性、出版目標、想定読者のメインジャンル）は**変えない**。変えるのは表現（言い回し、粒度、順序、空白地帯の具体化）のみ。
            - 「市場に副業本が並ぶから本書も副業前段に位置付ける」のような **市場の引力でジャンルを変える** ことは禁止。市場と本書ジャンルがズレているなら整合性診断で ✗ を出し、確定版冒頭に警告コメントを入れたうえで STEP1修正提案で具体的修正方向を示す（refine 自体は止めない）。
            - 数値（ランキング・売上推移）は HTMLから取得していないため、判断材料は質的情報（タイトル傾向・カテゴリ分布・評価分布・著者層）のみ。
            - 出力は上記フォーマットの見出し構成だけ。前置き・解説・補足は書かない。

            ━━━━━━━━━━━
            【Self-Refine：内部で自己批評→修正版を出力】
            ━━━━━━━━━━━

            上記の指示に従ってドラフトを生成した後、以下の手順で内部レビューし、最終的には修正版だけを出力フォーマットの形式で返してください。
            レビュープロセスの出力は禁止。最終レポートのみ返すこと。

            ## 内部 Step A: ドラフト生成
            出力フォーマットに従ってドラフトを生成。

            ## 内部 Step B: 自己批評（チェックリスト）

            1. **整合性診断の独立性**: 整合性診断が、草案と市場データの両方を踏まえた独立判断になっているか。草案を擁護する／市場に迎合する、のどちらにも偏っていないか。
            2. **市場検証の根拠**: 市場勝率診断・狙い目の切り口が、上位本データの具体的な傾向（タイトル語・評価分布・著者層）に裏付けられているか。希望的観測になっていないか。
            3. **コアの維持**: 確定版で草案のコア（仮テーマ・コア・ベネフィット・出版目標・想定読者のメインジャンル）が維持されているか。市場の引力で別ジャンルに引きずられていないか。
            4. **コア・ベネフィットの読者目線性**: コア・ベネフィットが「読者が何をできるようになるか」を読者目線の1文で表現できているか。著者目線の決意文（「〜したい」「〜してほしい」）になっていないか。
            5. **検索キーワード3軸の語数と整合性**: 3軸すべて厳格に2語。読者軸が本書コンセプトと別ジャンルでないか。
            6. **STEP1修正提案の構造**: ✗ や △ が出た項目に対応するフィールドだけが含まれているか。「現状 / 提案 / 根拠」の3要素が揃っているか。✓ ばかりなら「修正提案なし」と書いて省略しているか。
            7. **誘導臭リスク**: 確定版に著者サービス（Life Book Navigator 等）への誘導臭が出ていないか。

            ## 内部 Step C: 修正版を出力
            Step B で問題が見つかった箇所を修正した最終版を、出力フォーマットの形式で出力する。
            すべての観点が通過した場合はドラフトをそのまま出力してよい。
            繰り返し: レビュープロセス・各観点の指摘・差分の出力は禁止。最終レポートのみ返すこと。

            ━━━━━━━━━━━
            【改善要望機構（Phase 2）】
            ━━━━━━━━━━━

            previous_output と improvement_request の両方が空でない場合、ユーザーが戦略レビュー（外部AI）で評価された結果を踏まえて本市場検証＋確定版を根本的に直してほしいと要望している。

            手順:
            1. previous_output を読み込む
            2. improvement_request の指示を読み込む
            3. 改善要望に従って構造的に修正した新しい市場検証レポート＋確定版を生成する
              - 整合性診断の判定根拠は維持しつつ、改善要望が指摘する論点を反映する
              - 確定版テキスト（読者像・コンセプト・読了後の状態・狙い目の切り口）を改善要望に従って構造的に修正
              - 「✓ OK」と評価された部分は変更しない（前回出力からそのままコピー）
              - 「△ 要改善」「✗ 致命的」と指摘された部分を根本原因に基づいて修正
            4. Self-Refine プロセスを新しいドラフトに対しても適用

