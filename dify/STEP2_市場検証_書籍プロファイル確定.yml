    - data:
        code: "import re\nfrom typing import List, Dict\n\n\ndef _japanese_ratio(text: str) -> float:\n    if not text:\n        return 0.0\n    jp = 0\n    for c in text:\n        if ('\\u3040' <= c <= '\\u309f') or ('\\u30a0' <= c <= '\\u30ff') or ('\\u4e00' <= c <= '\\u9fff'):\n            jp += 1\n    return jp / len(text)\n\n\ndef _extract_books(html: str, axis_label: str, limit: int = 10) -> List[Dict[str, str]]:\n    if not html or not str(html).strip():\n        return []\n\n    text = str(html).replace('\\\\\"', '\"').replace('\\\\/', '/')\n\n    # スポンサー広告枠を除去\n    cleaned = re.sub(\n        r'<div[^>]*class=\"[^\"]*(?:AdHolder|ad-feedback|s-ad-feedback)[^\"]*\"[\\s\\S]*?</div>',\n        '',\n        text,\n        flags=re.IGNORECASE,\n    )\n\n    # 各検索結果ブロックを抽出（lookahead で次の s-search-result まで）\n    block_pattern = (\n        r'(<div[^>]*data-component-type=\"s-search-result\"[^>]*data-asin=\"([A-Za-z0-9]{10})\"[\\s\\S]*?)'\n        r'(?=<div[^>]*data-component-type=\"s-search-result\"|</body>|$)'\n    )\n    blocks = re.findall(block_pattern, cleaned, flags=re.IGNORECASE)\n\n    # 別パターン（属性順序が逆）も拾う\n    if not blocks:\n        block_pattern2 = (\n            r'(<div[^>]*data-asin=\"([A-Za-z0-9]{10})\"[^>]*data-component-type=\"s-search-result\"[\\s\\S]*?)'\n            r'(?=<div[^>]*data-component-type=\"s-search-result\"|</body>|$)'\n        )\n        blocks = re.findall(block_pattern2, cleaned, flags=re.IGNORECASE)\n\n    books: List[Dict[str, str]] = []\n    seen_asins = set()\n\n    for block_html, asin in blocks:\n        asin = asin.strip().upper()\n        if asin in seen_asins or len(asin) != 10:\n            continue\n        seen_asins.add(asin)\n\n        # タイトル（h2 内の span / aria-label / alt 等から拾う）\n        title = ''\n        title_m = re.search(r'<h2[^>]*>[\\s\\S]*?<span[^>]*>([^<]+)</span>', block_html)\n        if title_m:\n            title = title_m.group(1).strip()\n        if not title:\n            alt_m = re.search(r'<img[^>]*alt=\"([^\"]{4,})\"', block_html)\n            if alt_m:\n                title = alt_m.group(1).strip()\n\n        # 著者（『著者：xxx』『著xxx』『by xxx』を順に試す）\n        author = ''\n        author_m = re.search(r'(?:著\\u3000?者?|by|Author)[\\s\\u3000:：]*<[^>]+>([^<]{2,40})<', block_html, flags=re.IGNORECASE)\n        if author_m:\n            author = author_m.group(1).strip()\n        if not author:\n            # \"a-row a-size-base\" 内の <a> で 2〜30 字を著者候補に\n            cand_m = re.search(r'class=\"[^\"]*a-row a-size-base[^\"]*\"[^>]*>([\\s\\S]*?)</div>', block_html)\n            if cand_m:\n                a_m = re.search(r'<a[^>]*>([^<]{2,30})</a>', cand_m.group(1))\n                if a_m:\n                    author = a_m.group(1).strip()\n\n        # 評価（★）\n        rating = ''\n        rating_m = re.search(r'(\\d+\\.\\d)\\s*(?:つ星|out of 5 stars)', block_html)\n        if rating_m:\n            rating = rating_m.group(1)\n\n        # レビュー数\n        review_count = ''\n        review_m = re.search(r'aria-label=\"([\\d,]+)\\s*(?:件の評価|ratings|reviews)', block_html, flags=re.IGNORECASE)\n        if review_m:\n            review_count = review_m.group(1).replace(',', '')\n        if not review_count:\n            # \"<span>1,234</span>\" の数字を rating 表示の近くから拾う\n            num_m = re.search(r'<span[^>]*class=\"[^\"]*a-size-base[^\"]*\"[^>]*>([\\d,]+)</span>', block_html)\n            if num_m:\n                cand = num_m.group(1).replace(',', '')\n                if cand.isdigit() and int(cand) < 100000:\n                    review_count = cand\n\n        # 価格\n        price = ''\n        price_m = re.search(r'<span[^>]*class=\"a-price-whole\"[^>]*>([\\d,]+)', block_html)\n        if price_m:\n            price = price_m.group(1).replace(',', '')\n\n        # 洋書フィルタ：タイトルの日本語比率で簡易判定\n        if title and _japanese_ratio(title) < 0.2:\n            continue\n\n        if not title:\n            continue\n\n        books.append({\n            'axis': axis_label,\n            'asin': asin,\n            'title': title,\n            'author': author,\n            'rating': rating,\n            'review_count': review_count,\n            'price': price,\n        })\n\n        if len(books) >= limit:\n            break\n\n    return books\n\n\ndef _format_axis(label: str, books: List[Dict[str, str]]) -> str:\n    if not books:\n        return f'### {label}（データなし or 日本書籍が0件）'\n    lines = [f'### {label}（上位{len(books)}件）']\n    for i, b in enumerate(books, 1):\n        parts = [f\"{i}. {b['title']}\"]\n        if b.get('author'):\n            parts.append(f\"著者: {b['author']}\")\n        rating = b.get('rating', '')\n        review = b.get('review_count', '')\n        if rating and review:\n            parts.append(f\"★{rating}（{review}件）\")\n        elif rating:\n            parts.append(f\"★{rating}\")\n        elif review:\n            parts.append(f\"レビュー{review}件\")\n        if b.get('price'):\n            parts.append(f\"¥{b['price']}\")\n        lines.append('  - ' + ' / '.join(parts[1:]) if len(parts) > 1 else parts[0])\n        # 1行目だけはタイトル、2行目に詳細を置く形に組み直す\n        # 上の append は壊れているので最後だけ書き換える\n        lines[-1] = f\"{i}. {b['title']}\"\n        detail_parts = []\n        if b.get('author'):\n            detail_parts.append(f\"著者: {b['author']}\")\n        if rating and review:\n            detail_parts.append(f\"★{rating}（{review}件）\")\n        elif rating:\n            detail_parts.append(f\"★{rating}\")\n        elif review:\n            detail_parts.append(f\"レビュー{review}件\")\n        if b.get('price'):\n            detail_parts.append(f\"¥{b['price']}\")\n        if detail_parts:\n            lines.append('   ' + ' / '.join(detail_parts))\n    return '\\n'.join(lines)\n\n\ndef main(**kwargs) -> Dict[str, str]:\n    html_theme = kwargs.get('HTML') or kwargs.get('amazon_url') or kwargs.get('html_theme') or ''\n    html_reader = kwargs.get('html_reader') or ''\n    html_diff = kwargs.get('html_diff') or ''\n\n    theme_books = _extract_books(html_theme, '主題軸', limit=10)\n    reader_books = _extract_books(html_reader, '読者軸', limit=8)\n    diff_books = _extract_books(html_diff, '差分軸', limit=8)\n\n    sections = [\n        _format_axis('主題軸（本書テーマで読者が見る上位本）', theme_books),\n        _format_axis('読者軸（想定読者が普段読んでいる本）', reader_books),\n        _format_axis('差分軸（差別化したい類書）', diff_books),\n    ]\n\n    summary_parts = []\n    summary_parts.append(f\"主題軸: {len(theme_books)}件\")\n    summary_parts.append(f\"読者軸: {len(reader_books)}件\")\n    summary_parts.append(f\"差分軸: {len(diff_books)}件\")\n    summary = '日本書籍の抽出件数: ' + ' / '.join(summary_parts)\n\n    if len(theme_books) < 3:\n        summary += '\\n⚠ 主題軸の日本書籍が極端に少ない（市場機会または市場不存在のシグナル）'\n\n    market_data = summary + '\\n\\n' + '\\n\\n'.join(sections)\n\n    return {\n        'market_data': market_data,\n        'summary': summary,\n        'theme_count': str(len(theme_books)),\n        'reader_count': str(len(reader_books)),\n        'diff_count': str(len(diff_books)),\n    }\n"
        code_language: python3
        outputs:
          market_data:
            children: null
            type: string
          summary:
            children: null
            type: string
          theme_count:
            children: null
            type: string
          reader_count:
            children: null
            type: string
          diff_count:
            children: null
            type: string
